<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <title>deluxellec</title>
  <meta name="description" content="hi, a simple website i'm making.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dbd7db">
  <meta property="og:site_name" content="hanaoka.pages.dev">
  <link rel="canonical" href="https://hanaoka.pages.dev/">
  <link rel="stylesheet" href="style.css">
</head>

<body style="--scroll: 0;">
    <div class="background"></div>

    <header>
      <img src="/avatar.png" alt="avatar" class="avatar">
      <h1 class="site-title">deluxellec</h1>
    </header>

  <div class="avatar-credit">
    avatar: <a href="https://x.com/BlueMaka42" target="_blank" rel="noopener noreferrer">@BlueMaka</a>
    <span>|</span>
    bg: <a href="https://bsky.app/profile/image-labo.com" target="_blank" rel="noopener noreferrer">@image-labo.com</a>
  </div>

  <main class="page-two">
      <div class="grid-container">

        <section class="card discord">
          <div class="card-header">
            <span class="card-title">discord</span>
            <div class="color-dot"></div>
          </div>
          <div class="discord-profile">
            <div class="avatar-container image-container">
              <div class="avatar large-image"></div>
              <div class="small-image"></div>
            </div>
            <div class="user-info">
              <span class="display-name">Loading...</span>
              <span class="status">Offline</span>
            </div>
          </div>
          <div class="activity-details">
            <div class="activity bold overflow"></div>
            <div class="details overflow"></div>
            <div class="state overflow"></div>
          </div>
          <div class="timebar-container" style="display: none;">
            <span class="current-time">0:00</span>
            <div class="timebar"><div class="timebar-progress"></div></div>
            <span class="total-time">0:00</span>
          </div>
          <span class="timestamp"></span>
        </section>

        <section class="card clock">
          <span class="card-title">Timezone</span>
          <div class="clock-display">
            <div class="time-container">
              <span class="hour">00</span>:<span class="minute">00</span>:<span class="second">00</span>
            </div>
            <div class="date-container">
              <span class="date">--/--/----</span>
            </div>
          </div>
          <div class="timezone-info">
            <span class="timezone-diff">calculating...</span>
            <span class="utc-offset"></span>
          </div>
        </section>

        <section class="card github">
          <span class="card-title">github</span>
          <div class="stats-grid">
            <div class="stat-box">
              <span class="stat-number stat">0</span>
              <span class="stat-label">Repos</span>
            </div>
            <div class="stat-box">
              <span class="stat-number star">0</span>
              <span class="stat-label">Stars</span>
            </div>
            <div class="stat-box">
              <span class="stat-number fork">0</span>
              <span class="stat-label">Forks</span>
            </div>
          </div>
          <a href="https://github me" target="_blank" rel="noopener noreferrer" class="btn">
            Visit GitHub
          </a>
        </section>

        <section class="card osu">
          <span class="card-title">osu!</span>
          <p class="card-desc">Download my custom skin collection:</p>
          <a href="/skin/Minimal.osk" class="btn btn-osu">
            Download Skins (.osk)
          </a>
        </section>

        <section class="card image-card">
          <span class="card-title">Featured Image</span>
          <div class="image-wrapper">
            <img src="/background.png" alt="Featured showcase" class="card-image">
          </div>
        </section>

        <section class="card analytics">
          <span class="card-title">Site Stats</span>
          <div class="visitor-box">
            <span class="visitor-count">
              <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fhanaoka.pages.dev&count_bg=%23222222&title_bg=%23111111&icon=&icon_color=%23E7E7E7&title=visitors&edge_flat=true" alt="Visitor Counter"/>
            </span>
          </div>
          <button class="btn recorder">
            Record Screen
          </button>
        </section>

      </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
</body>
</html>
